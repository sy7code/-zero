<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img" aria-labelledby="title desc">
  <title id="title">당황Zero 프로토타입 화면 구성</title>
  <desc id="desc">3차 발표 자료를 따르는 홈, 안전 확인, 촬영 안내, 긴급 화면, 사고 기록 카드 화면 와이어프레임이다.</desc>
  <defs>
    <style>
      .bg { fill: #fbfaf7; }
      .phone { fill: #202124; }
      .screen { fill: #ffffff; }
      .brand { fill: #df4b32; }
      .danger { fill: #b42318; }
      .line { stroke: #d8d2ca; stroke-width: 2; fill: none; }
      .text { font: 700 14px "Pretendard", "Noto Sans KR", sans-serif; fill: #202124; }
      .small { font: 500 11px "Pretendard", "Noto Sans KR", sans-serif; fill: #656970; }
      .white { fill: #ffffff; }
      .title { font: 800 32px "Pretendard", "Noto Sans KR", sans-serif; fill: #202124; }
      .caption { font: 700 15px "Pretendard", "Noto Sans KR", sans-serif; fill: #444950; }
    </style>
  </defs>
  <rect class="bg" width="1280" height="680" />
  <text class="title" x="60" y="58">3차 데모 화면을 따라가는 Flutter 프로토타입</text>

  <g transform="translate(60 105)">
    <text class="caption" x="0" y="0">홈</text>
    <rect class="phone" x="0" y="16" width="170" height="320" rx="24" />
    <rect class="screen" x="12" y="36" width="146" height="280" rx="16" />
    <rect class="brand" x="26" y="55" width="118" height="70" rx="8" />
    <text class="white" x="38" y="86" font-size="14" font-weight="800">버튼만 누르는 대응</text>
    <text class="small" x="34" y="152">사진은 관찰 기록으로</text>
    <text class="small" x="34" y="174">기록은 내 폰에만</text>
    <rect class="brand" x="34" y="210" width="102" height="36" rx="18" />
    <text class="white" x="52" y="233" font-size="12" font-weight="800">시작</text>
  </g>

  <g transform="translate(285 105)">
    <text class="caption" x="0" y="0">안전 확인</text>
    <rect class="phone" x="0" y="16" width="170" height="320" rx="24" />
    <rect class="screen" x="12" y="36" width="146" height="280" rx="16" />
    <text class="text" x="30" y="78">다친 사람이</text>
    <text class="text" x="30" y="100">있나요?</text>
    <rect class="brand" x="30" y="130" width="110" height="32" rx="16" />
    <rect class="line" x="30" y="174" width="110" height="32" rx="16" />
    <rect class="line" x="30" y="218" width="110" height="32" rx="16" />
    <text class="white" x="68" y="151" font-size="12" font-weight="800">있음</text>
    <text class="small" x="68" y="195">없음</text>
    <text class="small" x="68" y="239">모름</text>
  </g>

  <g transform="translate(510 105)">
    <text class="caption" x="0" y="0">촬영 안내</text>
    <rect class="phone" x="0" y="16" width="170" height="320" rx="24" />
    <rect class="screen" x="12" y="36" width="146" height="280" rx="16" />
    <rect class="line" x="30" y="68" width="110" height="82" rx="8" />
    <path class="line" d="M55 109 H115 M85 79 V139" />
    <text class="text" x="30" y="178">전체 현장 사진</text>
    <text class="small" x="30" y="200">관찰 기록을 남김</text>
    <rect class="brand" x="30" y="235" width="110" height="34" rx="17" />
    <text class="white" x="62" y="257" font-size="12" font-weight="800">촬영</text>
  </g>

  <g transform="translate(735 105)">
    <text class="caption" x="0" y="0">긴급 화면</text>
    <rect class="phone" x="0" y="16" width="170" height="320" rx="24" />
    <rect class="screen" x="12" y="36" width="146" height="280" rx="16" />
    <rect class="danger" x="26" y="56" width="118" height="140" rx="8" />
    <text class="white" x="42" y="92" font-size="15" font-weight="800">긴급 확인</text>
    <text class="white" x="42" y="118" font-size="10">배포 전에는</text>
    <text class="white" x="42" y="137" font-size="10">데모 번호 연결</text>
    <rect class="screen" x="38" y="156" width="94" height="28" rx="14" />
    <text class="danger" x="53" y="174" font-size="11" font-weight="800">010-0000</text>
    <rect class="line" x="26" y="220" width="118" height="34" rx="17" />
    <text class="small" x="50" y="242">기록 계속</text>
  </g>

  <g transform="translate(960 105)">
    <text class="caption" x="0" y="0">기록 카드</text>
    <rect class="phone" x="0" y="16" width="170" height="320" rx="24" />
    <rect class="screen" x="12" y="36" width="146" height="280" rx="16" />
    <text class="text" x="30" y="75">사고 기록 카드</text>
    <rect class="line" x="30" y="96" width="110" height="36" rx="8" />
    <rect class="line" x="30" y="144" width="110" height="36" rx="8" />
    <rect class="line" x="30" y="192" width="110" height="36" rx="8" />
    <text class="small" x="40" y="118">상황 후보</text>
    <text class="small" x="40" y="166">누락 사진</text>
    <text class="small" x="40" y="214">진행 로그</text>
    <rect class="brand" x="30" y="252" width="110" height="34" rx="17" />
    <text class="white" x="60" y="274" font-size="12" font-weight="800">공유</text>
  </g>

  <text class="small" x="60" y="500">주의: 이 이미지는 발표용 최종 디자인이 아니라 3차 자료의 화면 구조를 코드와 문서에 반영하기 위한 기준 이미지다.</text>
</svg>
